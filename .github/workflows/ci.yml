name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["24.0.0", "24.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Clean reproducible install
        run: pnpm install --frozen-lockfile
      - name: Regression tests (fake CLIs, no live agents)
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Validate release tarball
        run: pnpm pack:check
      - name: Ensure lockfile stays unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
